name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run obsolete. Deploys are
# exempt below via cancel-in-progress:false semantics — a cancelled deploy could
# leave the server half-updated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Lint, type-check, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matches the Node version running on the VPS (v20.20.2), so a build that
      # passes here is a build that runs there.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # postinstall runs `prisma generate`; without it @prisma/client resolves
      # to an unbuilt stub and the Next.js build fails.
      - name: Install dependencies
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            nextjs-${{ hashFiles('package-lock.json') }}-
            nextjs-

      # Blocking: the pre-existing backlog (267 errors across 105 files) is
      # cleared, so `npm run lint` is clean and any new error is a regression.
      # next.config.ts still sets eslint.ignoreDuringBuilds, which means this
      # step is the only thing that catches lint errors - keep it blocking.
      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # The three integration suites skip themselves when no app answers at
      # TEST_BASE_URL (see tests/helpers/server.ts). They stay skipped here
      # until CI grows a MySQL service and a seeded database.
      - name: Test
        run: npm test

# There is deliberately no deploy job here.
#
# GitHub's runners cannot open a TCP connection to the VPS — the block is
# upstream of the box (ufw already allows 22 from anywhere and sshd listens on
# *:22), so `appleboy/ssh-action` only ever reached "dial tcp: i/o timeout".
#
# A self-hosted runner would solve the reachability problem, but this repository
# is public: any fork could then run arbitrary code on the production server
# through a pull request. That trade is not worth making.
#
# So deployment is pull-based instead. The server polls origin/main on a timer
# and deploys itself — see scripts/deploy-from-main.sh. It only ever runs code
# that is already on main, which is push-protected, so the public repo adds no
# attack surface. This workflow's job is to tell you whether main is green.
