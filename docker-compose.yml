services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: pishro-mysql
    environment:
      MYSQL_ROOT_PASSWORD: pishro_password
      MYSQL_DATABASE: pishro
      MYSQL_USER: pishro_user
      MYSQL_PASSWORD: pishro_password
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./prisma/migrations:/docker-entrypoint-initdb.d
    networks:
      - pishro-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Video Processing Worker
  video-processor:
    image: node:20-alpine
    container_name: pishro-video-processor
    working_dir: /app
    command: sh -c "npm install && npx tsx scripts/video-processor-worker.ts"

    volumes:
      # پروژه
      - .:/app
      # node_modules cache
      - video_processor_node_modules:/app/node_modules
      # فایل‌های موقت پردازش
      - video_temp:/tmp/video-processing

    environment:
      # Database
      - DATABASE_URL=${DATABASE_URL}

      # Object Storage (iranServer S3)
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_REGION=${S3_REGION:-default}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-}

      # Temp directory
      - TEMP_DIR=/tmp/video-processing

      # Node
      - NODE_ENV=${NODE_ENV:-production}

    # نصب FFmpeg در alpine
    entrypoint: |
      sh -c "
        echo '📦 Installing FFmpeg...'
        apk add --no-cache ffmpeg
        echo '✅ FFmpeg installed'
        echo '🚀 Starting video processor worker...'
        npm install
        npx tsx scripts/video-processor-worker.ts
      "

    restart: unless-stopped

    # Resource limits (اختیاری)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 512M

    networks:
      - pishro-network

    # Health check
    healthcheck:
      test: ["CMD", "node", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local
  video_processor_node_modules:
    driver: local
  video_temp:
    driver: local

networks:
  pishro-network:
    driver: bridge
